name: pr-check

on:
  pull_request:
    types:
      [
        opened,
        edited,
        synchronize,
        reopened,
        ready_for_review,
        labeled,
        unlabeled,
      ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR logic churn policy
        uses: actions/github-script@v9.0.0
        env:
          CHURN_THRESHOLD: "1000"
          ALLOWED_BASES: '["main", "release/*", "hotfix/*"]'
          NON_LOGIC_GLOBS: '["**/test/**", "**/tests/**", "*_test.*", "test_*.*", "test_*.py", "*.spec.*", "*.test.*", "docs/**", "*.md", "pnpm-lock.yaml", "uv.lock", "package-lock.json", "yarn.lock", "Cargo.lock", "go.sum", "poetry.lock", "**/migrations/**", "**/generated/**", "**/data/**"]'
          SIZE_LABELS: '["size/S", "size/M", "size/L", "size/XL"]'
          OVERRIDE_LABEL: '"size/override"'
        with:
          script: |
            // === SIZE-CHECK-LOGIC-START ===
            const threshold = Number(process.env.CHURN_THRESHOLD);
            const allowedBases = JSON.parse(process.env.ALLOWED_BASES);
            const nonLogicGlobs = JSON.parse(process.env.NON_LOGIC_GLOBS);
            const sizeLabels = JSON.parse(process.env.SIZE_LABELS);
            const overrideLabel = JSON.parse(process.env.OVERRIDE_LABEL);
            const pr = context.payload.pull_request;

            function escapeRegex(value) {
              return value.replace(/[|\{}()[\]^$+*?.]/g, '\$&');
            }

            function globToRegex(glob) {
              let regex = '^';
              for (let i = 0; i < glob.length; i += 1) {
                const char = glob[i];
                if (char === '*') {
                  if (glob[i + 1] === '*') {
                    i += 1;
                    if (glob[i + 1] === '/') {
                      i += 1;
                      regex += '(?:.*/)?';
                    } else {
                      regex += '.*';
                    }
                  } else {
                    regex += '[^/]*';
                  }
                } else if (char === '?') {
                  regex += '[^/]';
                } else {
                  regex += escapeRegex(char);
                }
              }
              return new RegExp(`${regex}$`);
            }

            const nonLogicMatchers = nonLogicGlobs.map((glob) => globToRegex(glob));
            function isNonLogicPath(path) {
              const basename = path.split('/').pop();
              return nonLogicMatchers.some((matcher) => matcher.test(path) || matcher.test(basename));
            }

            function allowedBaseMatches(base) {
              return allowedBases.some((pattern) => globToRegex(pattern).test(base));
            }

            function sizeBucket(churn) {
              if (churn <= 100) return sizeLabels[0];
              if (churn <= 300) return sizeLabels[1];
              if (churn <= threshold) return sizeLabels[2];
              return sizeLabels[3];
            }

            if (!allowedBaseMatches(pr.base.ref)) {
              core.setFailed(`Base branch '${pr.base.ref}' is not allowed for issue governance.`);
              return;
            }
            if (pr.draft) {
              core.info('Draft PR; skipping size enforcement.');
              return;
            }
            const currentLabels = pr.labels.map((label) => label.name);
            const hasOverride = currentLabels.includes(overrideLabel);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const logicChurn = files
              .filter((file) => !isNonLogicPath(file.filename))
              .reduce((sum, file) => sum + file.additions + file.deletions, 0);
            const bucket = sizeBucket(logicChurn);
            for (const label of sizeLabels.filter((label) => currentLabels.includes(label) && label !== bucket)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: label,
              }).catch((error) => {
                if (error.status !== 404) throw error;
              });
            }
            if (!currentLabels.includes(bucket)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [bucket],
              });
            }
            if (logicChurn > threshold && !hasOverride) {
              core.setFailed(`Logic churn ${logicChurn} exceeds threshold ${threshold}; add '${overrideLabel}' only with reviewer-approved exception.`);
            } else {
              core.info(`Logic churn ${logicChurn} classified as ${bucket}.`);
            }
            // === SIZE-CHECK-LOGIC-END ===
  layer1-format:
    name: layer1-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate actual changed package owners
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          python3 skills/skillify/scripts/validate-skill-format.py --diff-base "$BASE"
      - name: Exercise package-selection regressions
        run: python3 -m unittest discover -s tests/skillify -p test_validate_skill_format.py
      - name: Exercise optional sentence-reflow helper tests
        run: python3 -m unittest tests.skillify.test_reflow_sentences

  layer1-hygiene:
    name: layer1-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate changed-line hygiene
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          python3 skills/skillify/scripts/validate-runtime-hygiene.py --diff-base "$BASE"
      - name: Exercise hygiene regressions
        run: python3 -m unittest discover -s tests/skillify -p test_validate_runtime_hygiene.py

  distribution-version:
    name: distribution-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify package and plugin version bumps
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE=$(git merge-base "origin/${BASE_REF}" HEAD)
          python3 scripts/governance/tools/check_version_bump.py --diff-base "$BASE"
      - name: Run distribution guard tests
        run: python3 -m unittest scripts.governance.tests.test_check_version_bump scripts.governance.tests.test_verify_plugin_install scripts.governance.tests.test_resolve_plugin_revision scripts.governance.tests.test_install_sh tests.init.test_agents_region tests.init.test_package_contract

  typescript-baseline:
    name: typescript-baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install current official TypeScript compiler
        run: npm install --global typescript@latest
      - name: Verify unused-local and parameter boundaries
        run: python3 -m unittest tests.programming.test_typescript_baseline

  offline-transcribe-macos:
    name: offline-transcribe-macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create isolated Python environment and install current offline dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/offline-transcribe-venv"
          "$RUNNER_TEMP/offline-transcribe-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/offline-transcribe-venv/bin/python" -m pip install --upgrade mlx-whisper huggingface-hub
      - name: Exercise offline transcription tests
        run: |
          "$RUNNER_TEMP/offline-transcribe-venv/bin/python" -B -m unittest discover -s tests/offline-transcribe -p test_transcribe_offline.py
